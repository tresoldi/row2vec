# Configuration for serving as evotext.github.io/row2vec subpage
# This extends the main config with subpage-specific settings

title: Row2Vec Documentation
author: Tiago Tresoldi
copyright: "2025"
logo: ""

# Execute notebooks during build
execute:
  execute_notebooks: "off"
  timeout: 120
  stderr_output: "remove"
  allow_errors: true
  run_in_temp: false

# MyST settings
parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

# MyST-NB configuration
nb_execution_show_tb: false
nb_execution_timeout: 600
nb_merge_streams: true
nb_execution_excludepatterns: []
nb_output_stderr: "remove-warn"
nb_remove_code_outputs: false

# HTML output settings for subpage deployment
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  home_page_in_navbar: true
  baseurl: "/row2vec/"
  favicon: ""
  navbar_number_sections: false
  navigation_with_keys: true
  # Additional configuration for subpage deployment
  extra_footer: |
    <div class="bd-footer-info">
      <p>Part of the <a href="https://evotext.github.io/">EvoText</a> project ecosystem</p>
    </div>

# Repository information
repository:
  url: https://github.com/evotext/row2vec
  path_to_book: jupyter_book
  branch: main

# Launch buttons
launch_buttons:
  notebook_interface: "classic"
  binderhub_url: "https://mybinder.org"
  colab_url: "https://colab.research.google.com"
  thebe: false

# Sphinx configuration for API docs
sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.autosummary
    - sphinx.ext.napoleon
    - sphinx.ext.viewcode
  config:
    autodoc_member_order: "bysource"
    autodoc_typehints: "description"
    autodoc_preserve_defaults: true
    napoleon_google_docstring: true
    napoleon_numpy_docstring: true
    napoleon_include_init_with_doc: false
    add_module_names: false
    autosummary_generate: true
    html_theme_options:
      navigation_depth: 3
      show_toc_level: 2
    master_doc: 'intro'
