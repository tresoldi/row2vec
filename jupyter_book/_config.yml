# Book settings
title: Row2Vec Documentation
author: Tiago Tresoldi
copyright: "2025"
logo: ""  # Add logo path if available

# Execute notebooks during build
execute:
  execute_notebooks: "cache"  # Use cached outputs, execute if needed
  timeout: 600  # Timeout for notebook execution in seconds
  stderr_output: "remove"  # Remove stderr output (warnings, logs)
  allow_errors: true  # Allow errors for demo notebooks with missing data
  run_in_temp: false

# MyST settings for advanced markdown features
parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

# MyST-NB configuration for clean output
nb_execution_show_tb: false  # Don't show tracebacks
nb_execution_timeout: 600
nb_merge_streams: true  # Merge stdout/stderr
nb_execution_excludepatterns: []
nb_output_stderr: "remove-warn"  # Remove warning-level stderr
nb_remove_code_outputs: false

# HTML output settings
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  home_page_in_navbar: true
  baseurl: "https://evotext.github.io/row2vec/"  # Update with actual URL
  favicon: ""  # Add favicon if available
  navbar_number_sections: false
  navigation_with_keys: true

# Repository information
repository:
  url: https://github.com/evotext/row2vec
  path_to_book: jupyter_book
  branch: main

# Launch buttons for interactive notebooks
launch_buttons:
  notebook_interface: "classic"
  binderhub_url: "https://mybinder.org"
  colab_url: "https://colab.research.google.com"
  thebe: false

# Sphinx configuration for API docs
sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.autosummary
    - sphinx.ext.napoleon
    - sphinx.ext.viewcode
  config:
    autodoc_member_order: "bysource"
    autodoc_typehints: "description"
    autodoc_preserve_defaults: true
    napoleon_google_docstring: true
    napoleon_numpy_docstring: true
    napoleon_include_init_with_doc: false
    add_module_names: false
    autosummary_generate: true
    # Ensure consistent output directory
    html_theme_options:
      navigation_depth: 3
      show_toc_level: 2
    # Build output directory configuration  
    master_doc: 'intro'