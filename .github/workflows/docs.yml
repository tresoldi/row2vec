name: Build and Deploy Documentation

# Trigger on commits to main branch and manual dispatch
on:
  push:
    branches: [main]
    paths:
      # Only build docs when relevant files change
      - 'jupyter_book/**'
      - 'row2vec/**/*.py'  # API changes affect docs
      - 'README.md'
      - 'ROADMAP.md'
      - 'examples/**'
      - '.github/workflows/docs.yml'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no changes detected'
        required: false
        default: 'false'
        type: boolean
      deploy_method:
        description: 'Deployment method'
        required: false
        default: 'artifact'
        type: choice
        options:
          - 'artifact'
          - 'pages'

# Permissions for repository access and artifact upload
permissions:
  contents: read
  actions: write

# Only allow one docs build at a time
concurrency:
  group: "docs-build"
  cancel-in-progress: false

jobs:
  # Build documentation
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
    - name: 📚 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better change detection

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-docs-${{ hashFiles('jupyter_book/requirements.txt', 'requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-docs-
          ${{ runner.os }}-pip-

    - name: 🔧 Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        # Install row2vec package (needed for API docs)
        pip install -e .
        # Install documentation requirements
        pip install -r jupyter_book/requirements.txt

    - name: 🏗️ Build documentation
      working-directory: jupyter_book
      run: |
        echo "Building Row2Vec documentation with Jupyter Book..."
        echo "================================================="

        # Clean previous builds
        rm -rf _build/

        # Build documentation with proper base URL for evotext.github.io/row2vec
        jupyter-book build . --verbose

        # Create .nojekyll file to prevent GitHub Pages from processing with Jekyll
        touch _build/html/.nojekyll

        # Fix CSS imports for subpath deployment
        echo "🔧 Fixing CSS imports for subpath deployment..."

        # Fix theme.css to use absolute paths
        sed -i 's|@import "../basic.css";|@import "/row2vec/_static/basic.css";|g' _build/html/_static/styles/theme.css

        # Fix any other relative CSS imports
        find _build/html/_static -name "*.css" -exec sed -i 's|url(\.\./|url(/row2vec/_static/|g' {} \;
        find _build/html/_static -name "*.css" -exec sed -i 's|@import "\.\./|@import "/row2vec/_static/|g' {} \;

        # Verify build output
        if [ ! -f "_build/html/index.html" ]; then
          echo "❌ Documentation build failed - no index.html found"
          exit 1
        fi

        echo "✅ Documentation built successfully!"
        echo "📊 Build statistics:"
        find _build/html -name "*.html" | wc -l | xargs echo "  HTML files:"
        du -sh _build/html | cut -f1 | xargs echo "  Total size:"

    - name: 📋 Upload documentation artifacts
      id: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: row2vec-docs-${{ github.sha }}
        path: jupyter_book/_build/html/
        retention-days: 30  # Keep artifacts for 30 days
        compression-level: 6  # Good balance of speed and compression

    - name: 🚀 Deploy to evotext.github.io
      env:
        DEPLOY_TOKEN: ${{ secrets.EVOTEXT_DEPLOY_TOKEN }}
        GITHUB_USERNAME: ${{ github.actor }}
      run: |
        echo "🚀 Deploying documentation to evotext.github.io/row2vec..."

        # Configure git
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Clone evotext.github.io repository
        git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/evotext/evotext.github.io.git /tmp/evotext-site
        cd /tmp/evotext-site

        # Switch to master branch (evotext.github.io uses master)
        git checkout master

        # Remove existing row2vec directory if it exists
        rm -rf row2vec/

        # Copy new documentation
        cp -r $GITHUB_WORKSPACE/jupyter_book/_build/html/ row2vec/

        # Ensure .nojekyll exists in root to prevent Jekyll processing
        touch .nojekyll

        # Check if there are any changes
        if [ -n "$(git status --porcelain)" ]; then
          echo "📝 Changes detected, committing and pushing..."
          git add row2vec/ .nojekyll
          git commit -m "Update Row2Vec documentation (auto-deploy from ${{ github.sha }})"
          git push origin master
          echo "✅ Documentation deployed successfully!"
        else
          echo "ℹ️ No changes detected, skipping deployment."
        fi

    - name: 📝 Create build summary
      run: |
        echo "## 📚 Row2Vec Documentation Build & Deploy" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎯 **Live URL:** https://evotext.github.io/row2vec/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 **Build Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Artifact ID:** \`${{ steps.upload-artifact.outputs.artifact-id }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "jupyter_book/_build/html" ]; then
          echo "- **Pages built:** $(find jupyter_book/_build/html -name "*.html" | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total size:** $(du -sh jupyter_book/_build/html | cut -f1)" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Status:** Documentation automatically deployed to evotext.github.io" >> $GITHUB_STEP_SUMMARY
