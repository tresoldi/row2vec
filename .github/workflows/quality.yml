name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    name: Lint, format & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package with dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check formatting with ruff
        run: ruff format --check .
      - name: Lint with ruff
        run: ruff check .
      - name: Type check with mypy
        run: mypy
      - name: Security scan with bandit
        run: bandit -c pyproject.toml -r src/

  test:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    env:
      # Keep TensorFlow quiet and deterministic in CI.
      TF_CPP_MIN_LOG_LEVEL: '3'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,neural]"
      - name: Run tests with coverage
        run: pytest tests/ --cov=row2vec --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  light:
    name: Tests without the neural extra (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without TensorFlow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Confirm TensorFlow is absent
        run: python -c "import importlib.util as u; assert u.find_spec('tensorflow') is None"
      - name: Run tests (neural tests skip themselves)
        run: pytest tests/ --no-cov
