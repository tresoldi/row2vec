name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy types-PyYAML pandas-stubs
        pip install -e ".[dev]"
    - name: Lint with ruff
      run: |
        ruff check . --output-format=github
        ruff format --check .
    - name: Type check with mypy
      run: |
        echo "🔍 Running MyPy type checking (allowing some errors for complex modules)..."
        MYPY_ERRORS=$(mypy row2vec --show-error-codes 2>&1 | grep -E "error:|note:" | wc -l || echo 0)
        echo "📊 MyPy found $MYPY_ERRORS type issues"
        if [ "$MYPY_ERRORS" -gt 50 ]; then
          echo "❌ Too many MyPy errors ($MYPY_ERRORS > 50)"
          mypy row2vec --show-error-codes
          exit 1
        else
          echo "✅ MyPy error count within acceptable range"
        fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test with pytest
      run: |
        pytest --cov=row2vec --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  quality-gate:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy types-PyYAML pandas-stubs
        pip install -e ".[dev]"
    - name: Quality metrics check
      run: |
        echo "🔍 Running quality checks..."
        MYPY_ERRORS=$(mypy row2vec --show-error-codes 2>&1 | grep -E "error:|note:" | wc -l || echo 0)
        RUFF_ERRORS=$(ruff check . --quiet --exit-zero | wc -l)

        echo "📊 Quality Metrics:"
        echo "   MyPy errors: $MYPY_ERRORS"
        echo "   Ruff violations: $RUFF_ERRORS"

        # Quality gates - adjust thresholds as needed
        if [ "$MYPY_ERRORS" -gt 150 ]; then
          echo "❌ Too many MyPy errors ($MYPY_ERRORS > 150)"
          exit 1
        fi

        if [ "$RUFF_ERRORS" -gt 5000 ]; then
          echo "❌ Too many Ruff violations ($RUFF_ERRORS > 5000)"
          exit 1
        fi

        echo "✅ Quality gates passed!"
