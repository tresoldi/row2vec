[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "row2vec"
dynamic = ["version"]
description = "A Python library for learning low-dimensional vector embeddings from any tabular dataset."
readme = "README.md"
license = "MIT"
keywords = [
    "embeddings",
    "tabular-data",
    "dimensionality-reduction",
    "representation-learning",
    "autoencoder",
    "machine-learning",
]
authors = [
    { name = "Tiago Tresoldi", email = "row2vec@tresoldi.org" },
]
maintainers = [
    { name = "Tiago Tresoldi", email = "row2vec@tresoldi.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.5.3",
    "scikit-learn>=1.0.0",
    "tensorflow>=2.8.0",
    "umap-learn>=0.5.0",
    "psutil>=5.8.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Testing dependencies (lightweight; used by the CI test matrix)
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
]
# Documentation site (MkDocs + mkdocstrings)
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
# Development dependencies
dev = [
    # Testing (required by the Makefile and tests/)
    "row2vec[test]",

    # Code quality (required by the Makefile).
    # ruff/mypy pinned exactly so local, CI, and pre-commit run identical linter
    # versions (unpinned ruff/mypy drift silently changes check results).
    "ruff==0.16.0",
    "mypy==2.3.0",
    "bandit[toml]>=1.7.0",

    # Type stubs for the third-party libraries we call into.
    "pandas-stubs>=2.3.3.260113",
    "types-psutil",
    "types-PyYAML>=6.0.0",

    # Build and release (required by the Makefile)
    "build>=0.10.0",
    "twine>=4.0.0",
]
# All optional dependencies (runtime + development)
all = [
    "row2vec[dev,docs]",
]

[project.scripts]
row2vec = "row2vec.cli:main"

[project.urls]
Homepage = "https://github.com/tresoldi/row2vec"
Documentation = "https://row2vec.tresoldi.org/"
Repository = "https://github.com/tresoldi/row2vec.git"
Issues = "https://github.com/tresoldi/row2vec/issues"
Changelog = "https://github.com/tresoldi/row2vec/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "row2vec.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["row2vec*"]

[tool.setuptools.package-data]
row2vec = ["py.typed"]


# Ruff linting (replaces flake8, pycodestyle, pyflakes, isort, etc.)
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "NPY",   # NumPy-specific rules
    "RUF",   # Ruff-specific rules
    "D",     # pydocstyle
]

ignore = [
    "E501",   # Line too long (ruff format handles this)
    "B008",   # Do not perform function calls in argument defaults
    "RET504", # Unnecessary variable assignment before return
    "ARG002", # Unused method argument (common in abstract methods)
    "D202",   # No blank lines allowed after function docstring
    "D200",   # One-line docstring should fit on one line
    "D107",   # Missing docstring in __init__
    "D205",   # 1 blank line required between summary line and description
    # Migrating to `np.random.Generator` changes the numbers a given seed
    # produces, which would silently break every `seed=`-based reproducibility
    # guarantee (and the regression fixtures in tests/fixtures/). Deliberate.
    "NPY002", # Legacy np.random.* calls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # Unused function arguments in tests
    "ARG002",  # Unused method arguments in tests
    "D",       # Test docstrings are not user-facing documentation
    "S101",    # Use of assert detected (pytest uses assert)
    "T201",    # Allow print statements for manual inspection
]
"examples/**/*.py" = [
    "D",       # Examples read as scripts, not as API documentation
    "T201",    # Allow print statements in examples
]
"scripts/**/*.py" = [
    "D",       # Maintenance scripts are not user-facing documentation
    "T201",    # Allow print statements in scripts
]
"docs/tutorial_*.py" = [
    "D",       # Nhandu tutorial files are self-documenting prose
    "E402",    # Module level import not at top (pedagogical import placement)
    "T201",    # Allow print statements in tutorials
]

[tool.ruff.lint.isort]
known-first-party = ["row2vec"]
known-third-party = ["numpy", "pandas", "sklearn", "tensorflow", "umap", "pytest"]

[tool.ruff.lint.pydocstyle]
convention = "google"


# MyPy type checking
[tool.mypy]
# Target 3.12 so mypy can parse modern dependency stubs. Our 3.10 syntax
# compatibility is enforced by ruff (target-version = "py310") and validated by
# the 3.10 CI test matrix leg.
python_version = "3.12"
files = ["src/row2vec", "tests", "scripts"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Some third-party decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "sklearn.*",
    "umap.*",
    "psutil.*",
    "yaml.*",
]
ignore_missing_imports = true


# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=row2vec",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "neural: marks tests that train a neural network",
    "docs: marks tests that execute documentation examples",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


# Coverage configuration
[tool.coverage.run]
source = ["row2vec"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "tests/htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "docs", "examples"]
# B101 assert_used, B301/B403 pickle (the documented model-serialization format),
# B311 non-cryptographic random (seeding, sampling), B404/B603 subprocess,
# B110/B112 best-effort fallbacks around optional backends and metrics.
skips = ["B101", "B110", "B112", "B301", "B311", "B403", "B404", "B603"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]
